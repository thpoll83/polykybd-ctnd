<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=1.0">
  <title>PolyKybd CTND</title>
  <link rel="stylesheet" href="/static/style.css?v=23">
</head>
<body data-status="idle">
  <header>
    <span class="title">PolyKybd CTND</span>
    <span class="status-badge">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">idle</span>
    </span>
    <span class="ci-badge" id="ci-badge" data-ci="unknown" title="GitHub Actions CI status">CI</span>
    <span class="rn-badge" id="rn-badge" data-rn="unknown"
          title="Self-hosted runner status — tap to run diagnostics"
          onclick="runDiagnostics()">RUNNER</span>
    <span class="up-badge" id="up-badge" data-up="unknown"
          title="Station self-update status — tap to update from the tracked branch"
          onclick="updateStation()">UPDATE</span>
    <span class="clock" id="clock"></span>
  </header>

  <!-- One tab per mode. showTab() in app.js switches the sections below and
       remembers the last tab in localStorage. -->
  <nav id="tabs" role="tablist" aria-label="Station modes">
    <button class="tab" role="tab" id="tabbtn-test" aria-controls="tab-test" aria-selected="false" data-tab="test"     onclick="showTab('test')">Test</button>
    <button class="tab" role="tab" id="tabbtn-hardware" aria-controls="tab-hardware" aria-selected="false" data-tab="hardware" onclick="showTab('hardware')">Hardware</button>
    <button class="tab" role="tab" id="tabbtn-camera" aria-controls="tab-camera" aria-selected="false" data-tab="camera"   onclick="showTab('camera')">Camera</button>
    <button class="tab" role="tab" id="tabbtn-runner" aria-controls="tab-runner" aria-selected="false" data-tab="runner"   onclick="showTab('runner')">Runner</button>
  </nav>

  <main>
    <!-- ── Test: firmware, flash, run, results ── -->
    <section class="tab-panel" id="tab-test" role="tabpanel" aria-labelledby="tabbtn-test" hidden>
      <div class="firmware-row">
        <label>Left</label>
        <select id="left-fw"><option value="">— select firmware —</option></select>
        <label>Right</label>
        <select id="right-fw"><option value="">— select firmware —</option></select>
        <button class="btn btn-icon" onclick="refreshFirmware()" title="Refresh">&#x21BB;</button>
      </div>
      <div class="button-row">
        <button class="btn btn-blue"  id="btn-flash-left"  onclick="flashSide('left')">Flash Left</button>
        <button class="btn btn-blue"  id="btn-flash-right" onclick="flashSide('right')">Flash Right</button>
        <button class="btn btn-green" id="btn-run"         onclick="runTests()">Run Tests</button>
        <label class="chk" title="Also run the slow EXTENDED checks: startup animation, idle engage + Eden screensaver, split-link soak, and a reboot power cycle (~1 min more)">
          <input type="checkbox" id="extended-tests"> Extended
        </label>
        <button class="btn btn-teal"  id="btn-perf"        onclick="runPerf()" title="Flash the selected PROFILING firmware pair and measure main-loop timing, overlay cost and HID latency">Measure Perf</button>
      </div>
      <div id="results"><p class="placeholder">No test run yet. Results appear here, one row per test.</p></div>
    </section>

    <!-- ── Hardware: one card per half ── -->
    <section class="tab-panel" id="tab-hardware" role="tabpanel" aria-labelledby="tabbtn-hardware" hidden>
      <div class="hw-cards">
        <div class="hw-card">
          <h2>Left half <span class="hw-role">master (USB)</span></h2>
          <button class="btn btn-usb"     id="btn-usb-left"     data-state="unknown"  onclick="toggleUsb('left')">L: USB ?</button>
          <button class="btn btn-bootsel" id="btn-bootsel-left" data-state="released" onclick="toggleBootsel('left')">L: BOOTSEL</button>
          <button class="btn btn-reset"   id="btn-reset-left"   data-state="released" onclick="toggleRun('left')">L: Reset</button>
        </div>
        <div class="hw-card">
          <h2>Right half <span class="hw-role">slave</span></h2>
          <button class="btn btn-usb"     id="btn-usb-right"     data-state="unknown"  onclick="toggleUsb('right')">R: USB ?</button>
          <button class="btn btn-bootsel" id="btn-bootsel-right" data-state="released" onclick="toggleBootsel('right')">R: BOOTSEL</button>
          <button class="btn btn-reset"   id="btn-reset-right"   data-state="released" onclick="toggleRun('right')">R: Reset</button>
        </div>
      </div>
      <div class="button-row">
        <button class="btn btn-gray" id="btn-hand-left"  onclick="setHandedness(true)"  title="Tell the USB/master half it is the LEFT half (slave = right); keyboard reboots">Handedness: USB = Left</button>
        <button class="btn btn-gray" id="btn-hand-right" onclick="setHandedness(false)" title="Tell the USB/master half it is the RIGHT half (slave = left); keyboard reboots">Handedness: USB = Right</button>
      </div>
    </section>

    <!-- ── Camera: live view, last phase result, measure now ── -->
    <section class="tab-panel" id="tab-camera" role="tabpanel" aria-labelledby="tabbtn-camera" hidden>
      <div id="camera-panel">
        <div id="camera-stage">
          <!-- What the main view shows: the camera, the halves straightened, or the last run's frames. -->
          <div class="view-switch" id="camera-mode" role="group" aria-label="Camera view">
            <button class="btn btn-sm on" data-mode="live" aria-pressed="true" onclick="setViewMode('live')">Camera</button>
            <button class="btn btn-sm" data-mode="flat" id="mode-flat" aria-pressed="false" hidden onclick="setViewMode('flat')"
                    title="Each half cut out through its outline and straightened to the board's size">Flat halves</button>
            <button class="btn btn-sm" data-mode="last" id="mode-last" aria-pressed="false" hidden onclick="setViewMode('last')"
                    title="Three frames of the last recording (CI or Measure phase now)">Last run</button>
          </div>
        <div id="camera-frame">
          <img id="camera-img" alt="Live rig camera view">
          <!-- "Adjust view" with a lens correction: the image straightened. -->
          <canvas id="camera-undist" hidden></canvas>
          <!-- The saved outlines' edges on the live view (curved with a lens correction). -->
          <svg id="camera-curves" hidden></svg>
          <div id="camera-spinner" role="status" aria-label="Loading camera image"></div>
          <div id="camera-split" hidden></div>
          <span class="camera-tag" id="camera-tag-left" hidden></span>
          <span class="camera-tag" id="camera-tag-right" hidden></span>
          <div id="camera-box" hidden></div>
          <!-- "Adjust view": each board's outline warped into four draggable corners. -->
          <img class="camera-pcb" id="camera-pcb-left" alt="" hidden>
          <img class="camera-pcb" id="camera-pcb-right" alt="" hidden>
          <!-- "Flat halves": each half straightened to the board's millimetres. -->
          <div id="camera-flatview" hidden>
            <div class="flat-half"><canvas id="camera-flat-0"></canvas><img id="camera-flat-pcb-0" alt=""></div>
            <div class="flat-half"><canvas id="camera-flat-1"></canvas><img id="camera-flat-pcb-1" alt=""></div>
          </div>
          <div class="camera-handle" id="camera-handle-left-0" hidden></div>
          <div class="camera-handle" id="camera-handle-left-1" hidden></div>
          <div class="camera-handle" id="camera-handle-left-2" hidden></div>
          <div class="camera-handle" id="camera-handle-left-3" hidden></div>
          <div class="camera-handle" id="camera-handle-right-0" hidden></div>
          <div class="camera-handle" id="camera-handle-right-1" hidden></div>
          <div class="camera-handle" id="camera-handle-right-2" hidden></div>
          <div class="camera-handle" id="camera-handle-right-3" hidden></div>
          <!-- "Last run": three frames of the last recording, with what recorded it. -->
          <div id="camera-lastrun" hidden>
            <p id="phase-frames-label"></p>
            <div id="phase-frames"></div>
          </div>
        </div>
        </div>
        <p id="camera-msg">Loading camera…</p>
        <p id="camera-sharp" title="Variance of the Laplacian of the snapshot. Turn the lens until the number peaks; keep the camera and the scene still meanwhile."></p>
        <div class="button-row camera-buttons" id="camera-view-buttons">
          <button class="btn btn-gray btn-sm" onclick="refreshCamera()">&#x21BB; Refresh</button>
          <label class="chk chk-sm"><input type="checkbox" id="camera-live" checked onchange="cameraLive()"> Live (2 s)</label>
          <button class="btn btn-blue btn-sm" id="btn-adjust-view" onclick="startAdjust()"
                  title="Fit one PCB outline per half on the full camera image">Adjust view</button>
        </div>
        <!-- "Adjust view": drag the corners of each outline onto its board. -->
        <div class="button-row camera-buttons" id="camera-adjust-buttons" hidden>
          <label class="lens-slider" title="Wide-angle lens correction: move until the board edges look straight. 0 = none, negative = barrel">Lens
            <input type="range" id="camera-lens" min="-0.3" max="0.3" step="0.005" value="0" oninput="lensChanged()">
            <span id="camera-lens-val">0.000</span></label>
          <button class="btn btn-green btn-sm" id="btn-adjust-save" onclick="saveAdjust()" disabled>Save</button>
          <button class="btn btn-amber btn-sm" id="btn-adjust-reset" onclick="resetAdjust()"
                  title="Remove the view set here; config.yaml roi and split_x apply again">Use config.yaml</button>
          <button class="btn btn-gray btn-sm" onclick="cancelAdjust()">Cancel</button>
        </div>
      </div>
      <aside id="phase-panel">
        <h2>RGB phase between the halves</h2>
        <!-- Scrolls on its own, so the measure controls below stay reachable. -->
        <div id="phase-scroll">
        <div id="phase-last"><p class="placeholder">No measurement yet.</p></div>
        <svg id="phase-chart" viewBox="0 0 300 90" preserveAspectRatio="none" hidden>
          <polyline id="phase-line-master" fill="none" stroke="#4FC3F7" stroke-width="1.5"></polyline>
          <polyline id="phase-line-slave"  fill="none" stroke="#FFB74D" stroke-width="1.5"></polyline>
        </svg>
        <p class="chart-legend" id="phase-legend" hidden>
          <span class="lg-master">master</span> <span class="lg-slave">slave</span> brightness over the recording
        </p>
        <div id="phase-history-box" hidden>
          <h3>History</h3>
          <div id="phase-history"></div>
        </div>
        </div>
        <div class="phase-measure">
          <select id="phase-bin" title="The .bin of the build the rig runs; staging it shows the flash cue"><option value="">— .bin of the running build —</option></select>
          <p id="phase-bin-note"></p>
          <button class="btn btn-teal btn-sm" id="btn-measure-phase" onclick="measurePhase()"
                  title="Reset both halves (the left 1 s after the right), stage the selected .bin over HID (non-destructive, no apply) and record the flash cue on both halves">Measure phase now</button>
        </div>
      </aside>
    </section>

    <!-- ── Runner: CI jobs and runner service ── -->
    <section class="tab-panel" id="tab-runner" role="tabpanel" aria-labelledby="tabbtn-runner" hidden>
      <div id="ci-jobs-list"><p class="no-jobs">Loading CI jobs…</p></div>
      <div class="button-row">
        <button class="btn btn-blue"  id="btn-diagnose"   onclick="runDiagnostics()">⌕ Diagnose</button>
        <button class="btn btn-teal"  id="btn-restart"    onclick="restartRunner()">&#x27F3; Restart</button>
        <button class="btn btn-amber" id="btn-reregister" data-armed="false" onclick="reregisterRunner()">&#x21BB; Re-register</button>
        <button class="btn btn-gray"  id="btn-cancel-stale" data-armed="false" onclick="cancelStaleRuns()" disabled
                title="Cancel runs GitHub will never finish: queued with no jobs, or in progress with every job ended, for over an hour">⊘ No stale runs</button>
        <button class="btn btn-red"   onclick="quitApp()" title="Close the kiosk browser">Quit ✕</button>
      </div>
    </section>

  </main>

  <!-- The log drawer, on every tab. Collapsed it shows the newest line; tap
       the line or "Log" to open it. Commands that write to the log open it. -->
  <footer id="log-drawer" data-open="false">
    <div id="log-bar">
      <span id="log-last" onclick="toggleLog()" title="Newest log line — tap to open the log">—</span>
      <button class="btn btn-gray btn-xs" id="btn-copy" onclick="copyLog()">Copy</button>
      <button class="btn btn-gray btn-xs" onclick="clearLog()">Clear</button>
      <button class="btn btn-gray btn-xs" id="btn-log-toggle" onclick="toggleLog()" aria-expanded="false">Log ▲</button>
    </div>
    <div id="log-panel" hidden>
      <div id="log-output"></div>
    </div>
  </footer>

  <!-- Full-screen catch layer for the idle screen-blank (see app.js). It rises
       just before DPMS darkens the panel so the touch that wakes the display
       lands here — not on a Flash/Run button underneath — and is swallowed. -->
  <div id="wake-overlay" hidden><span class="hint">Touch to wake</span></div>

  <script src="/static/socket.io.min.js"></script>
  <script src="/static/app.js?v=29"></script>
</body>
</html>
