<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1024, initial-scale=1.0">
  <title>PolyKybd CTND</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body data-status="idle">
  <header>
    <span class="title">PolyKybd CTND</span>
    <span class="status-badge">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">idle</span>
    </span>
    <span class="ci-badge" id="ci-badge" data-ci="unknown" title="GitHub Actions CI status">CI</span>
    <span class="rn-badge" id="rn-badge" data-rn="unknown"
          title="Self-hosted runner status — tap to run diagnostics"
          onclick="runDiagnostics()">RUNNER</span>
    <span class="clock" id="clock"></span>
  </header>

  <main>
    <div id="log-panel">
      <div id="log-output"></div>
    </div>
    <div id="ci-jobs-panel" hidden>
      <div id="ci-jobs-list"><p class="no-jobs">Loading CI jobs…</p></div>
    </div>
  </main>

  <footer>
    <div id="main-controls">
      <div class="firmware-row">
        <label>Left</label>
        <select id="left-fw"><option value="">— select firmware —</option></select>
        <label>Right</label>
        <select id="right-fw"><option value="">— select firmware —</option></select>
        <button class="btn btn-icon" onclick="refreshFirmware()" title="Refresh">&#x21BB;</button>
      </div>
      <div class="button-row">
        <button class="btn btn-blue"  id="btn-flash-left"  onclick="flashSide('left')">Flash Left</button>
        <button class="btn btn-blue"  id="btn-flash-right" onclick="flashSide('right')">Flash Right</button>
        <button class="btn btn-green" id="btn-run"         onclick="runTests()">Run Tests</button>
        <button class="btn btn-gray"  id="btn-copy"        onclick="copyLog()">Copy Log</button>
        <button class="btn btn-gray"                       onclick="clearLog()">Clear Log</button>
        <button class="btn btn-gray"                       onclick="openRunner()">Runner ···</button>
        <button class="btn btn-gray"                       onclick="openMore()">More ···</button>
      </div>
    </div>

    <div id="runner-panel" hidden>
      <div class="button-row">
        <button class="btn btn-blue"  id="btn-diagnose"   onclick="runDiagnostics()">⌕ Diagnose</button>
        <button class="btn btn-teal"  id="btn-restart"    onclick="restartRunner()">&#x27F3; Restart</button>
        <button class="btn btn-amber" id="btn-reregister" data-armed="false" onclick="reregisterRunner()">&#x21BB; Re-register</button>
      </div>
      <div class="button-row more-nav">
        <button class="btn btn-gray" onclick="closeRunner()">&#8592; Back</button>
      </div>
    </div>

    <div id="more-panel" hidden>
      <div class="button-row">
        <button class="btn btn-sm btn-usb"     id="btn-usb-left"      data-state="unknown"  onclick="toggleUsb('left')">L: USB ?</button>
        <button class="btn btn-sm btn-bootsel" id="btn-bootsel-left"  data-state="released" onclick="toggleBootsel('left')">L: BOOTSEL</button>
        <button class="btn btn-sm btn-reset"   id="btn-reset-left"   data-state="released" onclick="toggleRun('left')">L: Reset</button>
        <button class="btn btn-sm btn-usb"     id="btn-usb-right"     data-state="unknown"  onclick="toggleUsb('right')">R: USB ?</button>
        <button class="btn btn-sm btn-bootsel" id="btn-bootsel-right" data-state="released" onclick="toggleBootsel('right')">R: BOOTSEL</button>
        <button class="btn btn-sm btn-reset"   id="btn-reset-right"  data-state="released" onclick="toggleRun('right')">R: Reset</button>
      </div>
      <div class="button-row">
        <button class="btn btn-sm btn-gray" id="btn-hand-left"  onclick="setHandedness(true)"  title="Tell the USB/master half it is the LEFT half (slave = right); keyboard reboots">Hand: USB=Left</button>
        <button class="btn btn-sm btn-gray" id="btn-hand-right" onclick="setHandedness(false)" title="Tell the USB/master half it is the RIGHT half (slave = left); keyboard reboots">Hand: USB=Right</button>
      </div>
      <div class="button-row more-nav">
        <button class="btn btn-gray" onclick="closeMore()">&#8592; Back</button>
        <button class="btn btn-red"  onclick="quitApp()">Quit ✕</button>
      </div>
    </div>
  </footer>

  <!-- Full-screen catch layer for the idle screen-blank (see app.js). It rises
       just before DPMS darkens the panel so the touch that wakes the display
       lands here — not on a Flash/Run button underneath — and is swallowed. -->
  <div id="wake-overlay" hidden><span class="hint">Touch to wake</span></div>

  <script src="/static/socket.io.min.js"></script>
  <script src="/static/app.js?v=2"></script>
</body>
</html>
