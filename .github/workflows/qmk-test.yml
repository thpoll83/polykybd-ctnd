# Template — this file lives in polykybd-ctnd for reference.
# The copy in thpoll83/qmk_firmware/.github/workflows/ is the live one.
#
# It is set to `workflow_dispatch` (manual) only: it cannot succeed in THIS
# repo because the QMK keyboard sources live in thpoll83/qmk_firmware, not here,
# so `qmk compile` has nothing to build. Auto-running it on push/PR just
# produced a permanent red "Build firmware" failure. Copy it into qmk_firmware
# (where it gets real push/pull_request triggers) to actually use it.
name: Build and HIL Test

on:
  workflow_dispatch:

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-latest
    outputs:
      split72: ${{ steps.names.outputs.split72 }}
      split72_hil: ${{ steps.names.outputs.split72_hil }}
      split42: ${{ steps.names.outputs.split42 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build split72 (primary)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default

      # HIL build: same firmware but with POLYKYBD_HIL, which forces the left
      # half to be master (EE_HANDS) instead of VBUS detection. On the rig both
      # halves are USB-powered, so stock VBUS detection makes both think they
      # are master. This is the artifact the test station flashes to both sides.
      - name: Build split72 (HIL force-master)
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split72 -km default -e POLYKYBD_HIL=yes -e TARGET=polykybd_split72_hil

      - name: Build split42
        uses: docker://qmkfm/qmk_cli
        with:
          args: qmk compile -kb polykybd/split42 -km default

      - id: names
        run: |
          echo "split72=$(ls polykybd_split72_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split72_hil=$(ls polykybd_split72_hil*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"
          echo "split42=$(ls polykybd_split42_default*.uf2 2>/dev/null | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: "*.uf2"
          retention-days: 7

  hil-test:
    name: HIL test (split72)
    needs: build
    runs-on: [self-hosted, polykybd-ctnd]
    steps:
      - name: Locate station directory
        id: ctnd
        run: |
          # Use CTND_DIR env var if set; otherwise find the first candidate
          # that actually has a venv (directory existing is not enough).
          dir="${CTND_DIR:-}"
          if [ -z "$dir" ]; then
            for candidate in /opt/polykybd-ctnd "$HOME/polykybd-ctnd"; do
              if [ -f "$candidate/venv/bin/python" ]; then
                dir="$candidate"
                break
              fi
            done
          fi
          if [ -z "$dir" ]; then
            echo "ERROR: could not find a polykybd-ctnd install with a venv." >&2
            echo "Set CTND_DIR in the runner environment or run scripts/setup.sh." >&2
            exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ${{ steps.ctnd.outputs.dir }}/firmware

      - name: Flash and test
        run: |
          cd ${{ steps.ctnd.outputs.dir }}
          venv/bin/python -m station.test_runner \
            --left  "firmware/${{ needs.build.outputs.split72_hil }}" \
            --right "firmware/${{ needs.build.outputs.split72_hil }}"
